[package]
name = "shell"
version = "0.1.0"
description = "Web3 Dev Studio - OpenCode powered"
authors = ["Howard Lee"]
license = "MIT"
repository = "https://github.com/howardleegeek/shell"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = ["shell-open"] }
tauri-plugin-shell = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
