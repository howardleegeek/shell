name: Test Agent Code

# Triggers: when agent pushes to task/* branch, or manual
on:
  push:
    branches:
      - 'task/**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to test (e.g. task/S01-fork-bolt-diy)'
        required: false
        type: string

permissions:
  contents: read
  statuses: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web-ui

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile

      - name: TypeScript check
        id: typecheck
        continue-on-error: true
        run: |
          npx tsc --noEmit 2>&1 | tee /tmp/tsc.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Build
        id: build
        continue-on-error: true
        run: |
          npx vite build 2>&1 | tee /tmp/build.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Run tests
        id: tests
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        run: |
          # Run tests/ directory if test runner exists
          if [ -f web-ui/vitest.config.ts ] || [ -f vitest.config.ts ]; then
            cd web-ui && npx vitest run --reporter=verbose 2>&1 | tee /tmp/test.log
          elif command -v jest &>/dev/null || [ -f jest.config.js ]; then
            npx jest --passWithNoTests 2>&1 | tee /tmp/test.log
          else
            echo "No test runner configured — skipping"
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        run: |
          echo "## Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.typecheck.outcome }}" = "success" ]; then
            echo "| TypeScript | :white_check_mark: Pass |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| TypeScript | :x: Fail |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ steps.build.outcome }}" = "success" ]; then
            echo "| Build | :white_check_mark: Pass |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Build | :x: Fail |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ steps.tests.outcome }}" = "success" ]; then
            echo "| Tests | :white_check_mark: Pass |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Tests | :x: Fail |" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Show errors if any step failed
          if [ "${{ steps.typecheck.outcome }}" != "success" ] && [ -f /tmp/tsc.log ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "<details><summary>TypeScript Errors</summary>" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -30 /tmp/tsc.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "</details>" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ steps.build.outcome }}" != "success" ] && [ -f /tmp/build.log ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "<details><summary>Build Errors</summary>" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -30 /tmp/build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "</details>" >> "$GITHUB_STEP_SUMMARY"
          fi
