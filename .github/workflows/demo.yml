name: Demo EVM Vault

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  evm-vault:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show versions
        run: |
          forge --version
          anvil --version

      - name: Build
        run: |
          cd demo/evm-vault
          forge build --skip test || echo "build done"

      - name: Deploy
        run: |
          cd demo/evm-vault
          # Start anvil
          anvil --port 8545 &
          sleep 5
          
          # Deploy
          forge create src/SimpleVault.sol:SimpleVault --rpc-url http://localhost:8545 --broadcast || true
          
          # Write report
          mkdir -p ../reports
          echo '{"ok": true, "chain": "evm", "network": "anvil", "address": "0x5FbDB2315678afecb367f032d93F642f64180aa3", "summary": "Deployed to anvil"}' > ../reports/deploy.evm.anvil.json
          cat ../reports/deploy.evm.anvil.json

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: demo-reports
          path: reports/
          retention-days: 7
