name: Demo EVM Vault - OpenCrabs Integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  # Test shell-run standalone
  shell-run-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: howardleegeek/shell

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run shell-run test
        run: |
          # Run shell-run test directly via node
          cd demo/evm-vault
          node ../../runner/src/index.js test --chain evm

      - name: Verify test report
        run: |
          cat demo/evm-vault/reports/test.evm.forge.json
          # Verify report structure
          echo "ok=$(cat demo/evm-vault/reports/test.evm.forge.json | jq -r '.ok')"
          echo "passed=$(cat demo/evm-vault/reports/test.evm.forge.json | jq -r '.details.passed')"

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: shell-run-reports
          path: demo/evm-vault/reports/
          retention-days: 7

  # Test OpenCrabs with Web3 tools
  opencrabs-web3-test:
    runs-on: ubuntu-latest
    needs: shell-run-test
    steps:
      - uses: actions/checkout@v4
        with:
          repository: howardleegeek/opencrabs
          path: opencrabs

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build OpenCrabs
        run: |
          cd opencrabs
          cargo build --release
          # Make sure web3 tools are compiled
          cargo build --release 2>&1 | grep -E "(web3_test|web3_report|web3_deploy)" || echo "Building web3 tools..."

      - name: Verify Web3 tools exist in binary
        run: |
          cd opencrabs
          # Check the binary has web3 tool symbols
          strings target/release/opencrabs | grep -E "web3_" | head -5

      - name: Show OpenCrabs version
        run: |
          cd opencrabs
          ./target/release/opencrabs --version || true
