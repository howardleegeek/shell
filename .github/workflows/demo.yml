name: Demo EVM Vault

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # Manual trigger
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC

jobs:
  evm-vault:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install Foundry
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      # Install Node.js for shell-run
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # Install shell-run dependencies
      - name: Install runner deps
        run: cd runner && npm install

      # Show versions
      - name: Show versions
        run: |
          forge --version
          anvil --version
          node -v

      # Install demo deps
      - name: Install demo deps
        run: |
          cd demo/evm-vault
          # Try forge install, if fails continue anyway
          forge install openzeppelin/openzeppelin-contracts foundry-rs/forge-std --no-commit || true

      # 1) First test should FAIL (deliberate event mismatch)
      - name: Test (expected fail)
        run: |
          # Run from repo root
          cd $GITHUB_WORKSPACE
          
          # Install demo deps first
          cd demo/evm-vault
          forge install
          cd ../..
          
          # Run test via shell-run
          node runner/src/index.js test --chain evm
          
          # Verify report exists and shows failure
          test -f reports/test.evm.forge.json
          echo "=== Test Report ==="
          cat reports/test.evm.forge.json
          
          # Assert ok=false
          jq -e '.ok == false' reports/test.evm.forge.json

      # 2) Apply patch: fix event name (Deposited -> Deposit)
      - name: Apply patch
        run: |
          sed -i 's/event Deposited/event Deposit/g' demo/evm-vault/src/SimpleVault.sol
          grep "event Deposit" demo/evm-vault/src/SimpleVault.sol

      # 3) Test should PASS
      - name: Test (expected pass)
        run: |
          cd $GITHUB_WORKSPACE
          node runner/src/index.js test --chain evm
          
          # Verify report shows success
          echo "=== Test Report ==="
          cat reports/test.evm.forge.json
          
          # Assert ok=true
          jq -e '.ok == true' reports/test.evm.forge.json

      # 4) Deploy on anvil (local)
      - name: Deploy (anvil)
        run: |
          cd $GITHUB_WORKSPACE
          node runner/src/index.js deploy --network anvil --chain evm
          
          # Verify deploy report
          echo "=== Deploy Report ==="
          cat reports/deploy.evm.anvil.json
          
          # Assert has address
          jq -e '.address and (.address|type=="string") and (.address|length > 0)' reports/deploy.evm.anvil.json
          jq -e '.ok == true' reports/test.evm.forge.json

      # 4) Deploy on anvil (local)
      - name: Deploy (anvil)
        run: |
          cd $GITHUB_WORKSPACE
          node runner/src/index.js deploy --network anvil --chain evm
          
          # Verify deploy report
          echo "=== Deploy Report ==="
          cat reports/deploy.evm.anvil.json
          
          # Assert has address
          jq -e '.address and (.address|type=="string") and (.address|length > 0)' reports/deploy.evm.anvil.json

      # Upload reports as artifact
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: demo-reports
          path: reports/
          retention-days: 7
