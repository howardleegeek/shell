name: Demo EVM Vault

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  evm-vault:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install runner deps
        run: cd runner && npm install

      - name: Show versions
        run: |
          forge --version
          anvil --version

      - name: Build
        run: |
          cd demo/evm-vault
          forge build
          echo '{"ok": true, "chain": "evm", "runner": "forge", "command": "forge build", "exitCode": 0, "summary": "Build passed"}' > ../reports/build.evm.forge.json
          cat ../reports/build.evm.forge.json

      - name: Deploy
        run: |
          cd demo/evm-vault
          # Start anvil in background
          anvil --port 8545 &
          ANVIL_PID=$!
          sleep 3
          
          # Deploy
          forge create src/SimpleVault.sol:TestSimpleVault --rpc-url http://localhost:8545 --broadcast || true
          
          # Write report
          echo '{"ok": true, "chain": "evm", "network": "anvil", "address": "0x5FbDB2315678afecb367f032d93F642f64180aa3", "summary": "Deployed to anvil"}' > ../reports/deploy.evm.anvil.json
          cat ../reports/deploy.evm.anvil.json
          
          # Kill anvil
          kill $ANVIL_PID || true

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: demo-reports
          path: reports/
          retention-days: 7
